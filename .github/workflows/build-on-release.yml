name: Build Custom Caddy

on:
  schedule:
    - cron: '0 0 * * *' # Checks every day at midnight
  workflow_dispatch:      # Allows you to run it manually

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Get latest Caddy version ⬇️ 
        id: caddy_version
        run: |
          # Fetch the latest release tag from Caddy's official API
          VERSION=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name | sed 's/^v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not fetch Caddy version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log in to Docker Hub 🔐
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build 🏗️ & Push to Docker Hub 🚀
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }}

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow through the API resets that timer.
  keepalive:
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Keep scheduled workflow alive 💓
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-on-release.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
